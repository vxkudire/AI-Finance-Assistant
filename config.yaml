# ---------- Default chat model (used by every agent unless overridden) ----------
llm:
  provider: openai          # any provider supported by langchain's init_chat_model
  model: gpt-4o-mini
  temperature: 0.1
  max_tokens: 5000

# ---------- Embeddings (MUST match the Pinecone index dimension) ----------
embeddings:
  provider: openai
  model: text-embedding-3-small
  dimension: 1536

# ---------- Pinecone ----------
pinecone:
  index_name: finance-education
  cloud: aws
  region: us-east-1
  metric: cosine

# ---------- RAG ----------
rag:
  chunk_size: 900
  chunk_overlap: 120
  top_k: 4
  knowledge_base_dir: src/data/knowledge_base   # sub-folder name == Pinecone namespace

# ---------- Per-agent overrides ----------
agents:
  router:
    temperature: 0
  finance_qa:
    rag_namespaces: [finance_qa]
    model: gpt-4o
    provider: openai
  portfolio:
    rag_namespaces: [portfolio, finance_qa]
  market:
    rag_namespaces: [finance_qa]
  goal_planning:
    rag_namespaces: [goal_planning]
    default_annual_return: 0.06      # illustrative assumption, always disclosed to the user
    model: gpt-4o
    provider: openai
  news:
    rag_namespaces: [finance_qa]
  tax:
    rag_namespaces: [tax]


# ---------- Live data ----------
data:
  default_indices: ["^GSPC", "^DJI", "^IXIC"]
  max_news_items: 8
  news_feeds:
    - https://www.cnbc.com/id/100003114/device/rss/rss.html
    - https://feeds.marketwatch.com/marketwatch/topstories/
    - https://feeds.finance.yahoo.com/rss/2.0/headline?s=^GSPC&region=US&lang=en-US
